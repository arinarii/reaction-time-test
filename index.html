<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Reaction Test</title>

<style>
    html,body{
        margin:0;
        width:100%;
        height:100%;
        overflow:hidden;
        font-family:Arial,sans-serif;
        background:#111;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    #box{
        width:420px;
        height:260px;
        border-radius:12px;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:40px;
        font-weight:700;
        user-select:none;
        cursor:pointer;
        color:white;
    }

    .idle{
        background:#555;
    }

    .waiting{
        background:#8b0000;
    }

    .ready{
        background:#00c853;
    }
</style>
</head>

<body>

<div id="box" class="idle">CLICK TO START</div>

<script>
const box = document.getElementById("box");

let startTime = 0;
let waiting = false;
let ready = false;
let timer = 0;

function start() {

    waiting = true;
    ready = false;

    box.className = "waiting";
    box.textContent = "WAIT...";

    timer = setTimeout(() => {

        ready = true;
        waiting = false;

        box.className = "ready";
        box.textContent = "CLICK";

        startTime = performance.now();

    }, (Math.random() * 2000) + 500);
}

box.onpointerdown = () => {

    // start game
    if(!waiting && !ready){
        start();
        return;
    }

    // clicked too early
    if(waiting){
        clearTimeout(timer);

        waiting = false;

        box.className = "idle";
        box.textContent = "TOO EARLY";
        return;
    }

    // successful click
    if(ready){

        const reaction = performance.now() - startTime;

        ready = false;

        box.className = "idle";
        box.textContent = reaction.toFixed(0) + " MS";
    }
};
</script>

</body>
</html>
