<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Reaction Test</title>

<style>
    html,body{
        margin:0;
        width:100%;
        height:100%;
        overflow:hidden;
        font-family:Arial,sans-serif;
        background:#111;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    #box{
        width:420px;
        height:260px;
        border-radius:12px;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:40px;
        font-weight:700;
        user-select:none;
        cursor:pointer;
        color:white;
    }

    .idle{
        background:#555;
    }

    .waiting{
        background:#8b0000;
    }

    .ready{
        background:#00c853;
    }
</style>
</head>

<body>

<div id="box" class="idle">reaction time test w/ sfx</div>

<script>
const box = document.getElementById("box");

// ==========================
// EDIT EVERYTHING HERE
// ==========================

const SPIKERS = {
    Tsh: {
        NoTilt: {
            15: 300,
            12: 266
        }
    },

    Akari: {
        Wtilt: {
            15: 266,
            12: 216
        }
    },

    Yogan: {
        Wtilt: {
            15: 300
        },
        WAtilt: {
            12: 266
        }
    }
};

// ==========================

const heights = [12, 15];

let startTime = 0;
let waiting = false;
let ready = false;
let timer = 0;

let currentAttack = null;

// preload sound
const hitSound = new Audio("soundEffect.mp3");
hitSound.preload = "auto";

function randomAttack(){

    const spikers = Object.keys(SPIKERS);

    while(true){

        const spiker =
            spikers[Math.floor(Math.random()*spikers.length)];

        const techniques =
            Object.keys(SPIKERS[spiker]);

        const technique =
            techniques[Math.floor(Math.random()*techniques.length)];

        const height =
            heights[Math.floor(Math.random()*heights.length)];

        const timing =
            SPIKERS[spiker][technique][height];

        // retry if this combo doesn't exist
        if(timing !== undefined){

            return {
                spiker,
                technique,
                height,
                timing
            };
        }
    }
}

function start(){

    currentAttack = randomAttack();

    waiting = true;
    ready = false;

    box.className = "waiting";
    box.textContent = "WAIT...";

    timer = setTimeout(()=>{

        ready = true;
        waiting = false;

        box.className = "ready";

        const technique =
            currentAttack.technique === "NoTilt"
            ? ""
            : ` (${currentAttack.technique})`;

        box.innerHTML =
            `${currentAttack.spiker}${technique}<br>${currentAttack.height} Height`;

        hitSound.currentTime = 0;
        hitSound.play();

        startTime = performance.now();

    }, Math.random()*2000 + 500);
}

box.onpointerdown = ()=>{

    if(!waiting && !ready){
        start();
        return;
    }

    if(waiting){

        clearTimeout(timer);

        waiting = false;

        box.className = "idle";
        box.textContent = "TOO EARLY";
        return;
    }

    if(ready){

        const reaction = performance.now() - startTime;

        ready = false;

        box.className = "idle";

        const threshold = currentAttack.timing;

        const success = reaction < threshold;

        const technique =
            currentAttack.technique === "NoTilt"
            ? ""
            : ` (${currentAttack.technique})`;

        if(success){

            box.innerHTML =
            `${reaction.toFixed(0)} ms<br>
            PASS<br>
            ${currentAttack.spiker}${technique}<br>
            ${currentAttack.height} Height`;

        }else{

            box.innerHTML =
            `${reaction.toFixed(0)} ms<br>
            FAIL<br>
            ${currentAttack.spiker}${technique}<br>
            ${currentAttack.height} Height<br>
            Should've been earlier than ${threshold} ms`;
        }
    }
};
</script>

</body>
</html>
