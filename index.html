<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Reaction Test</title>

<style>
    html,body{
        margin:0;
        width:100%;
        height:100%;
        overflow:hidden;
        font-family:Arial,sans-serif;
        background:#eee;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    #box{
        padding:20px;
        width:400px;
        height:260px;
         text-align:center;
    
        border-radius:12px;
    
        display:flex;
        justify-content:center;
        align-items:center;
    
        font-size:42px;
        font-weight:700;
    
        color:white;
        user-select:none;
        cursor:pointer;
    }

    .idle{
        background:#555;
    }

    .waiting{
        background:#8b0000;
    }

    .ready{
        background:#00c853;
    }

    #container{
    width:700px;
    display:flex;
    flex-direction:column;
    gap:20px;
    align-items:center;
}

#feedback{

    width:400px;
    height:400px;

    background:#333;
    padding:20px;
    border:1px solid #fff;
    border-radius:12px;

    color:white;

    box-sizing:border-box;

    padding:20px;

    font-size:12px;
    line-height:1.4;

    display:flex;
    justify-content:flex-start;
    align-items:flex-start;

    text-align:left;

    overflow:hidden;

}

.pass{
    color:#35ff79;
}

.fail{
    color:#ff6060;
}

.pass,
.fail{
    width:100%;
    height:100%;
}

    .feedback-title{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    margin-bottom:4px;
}

.feedback-result{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:18px;
}

.feedback-info{
    text-align:left;
    font-size:18px;
    line-height:1.35;
}
</style>
</head>

<body>

<div id="container">

    <div id="box" class="idle">
        reaction time test w/ sfx
    </div>

    <div id="feedback">
        Click the box to begin.
    </div>

</div>

<script>
const box = document.getElementById("box");
const feedback = document.getElementById("feedback");

// ==========================
// EDIT EVERYTHING HERE
// ==========================

const SPIKERS = {
    Tsh: {
        NoTilt: {
            15: 300,
            12: 266
        }
    },

    Akari: {
        Wtilt: {
            15: 266,
            12: 216
        }
    },

    Yogan: {
        Wtilt: {
            15: 300
        },
        WAtilt: {
            12: 266
        }
    }
};

// ==========================

const heights = [12, 15];

let startTime = 0;
let waiting = false;
let ready = false;
let timer = 0;

let currentAttack = null;

// preload sound
const hitSound = new Audio("soundEffect.mp3");
hitSound.volume = 0.5; // 20% volume
hitSound.preload = "auto";

function randomAttack(){

    const spikers = Object.keys(SPIKERS);

    while(true){

        const spiker =
            spikers[Math.floor(Math.random()*spikers.length)];

        const techniques =
            Object.keys(SPIKERS[spiker]);

        const technique =
            techniques[Math.floor(Math.random()*techniques.length)];

        const height =
            heights[Math.floor(Math.random()*heights.length)];

        const timing =
            SPIKERS[spiker][technique][height];

        // retry if this combo doesn't exist
        if(timing !== undefined){

            return {
                spiker,
                technique,
                height,
                timing
            };
        }
    }
}

function start(){

    currentAttack = randomAttack();

    waiting = true;
    ready = false;

    box.className = "waiting";
    box.textContent = "WAIT...";

    timer = setTimeout(()=>{

        ready = true;
        waiting = false;

        box.className = "ready";

        const technique =
            currentAttack.technique === "NoTilt"
            ? ""
            : ` (${currentAttack.technique})`;

        box.innerHTML =
            `${currentAttack.spiker}${technique}<br>${currentAttack.height} Height`;

        hitSound.currentTime = 0;
        hitSound.play();

        startTime = performance.now();

    }, Math.random()*2000 + 500);
}

box.onpointerdown = ()=>{

    if(!waiting && !ready){
        start();
        return;
    }

    if(waiting){

        clearTimeout(timer);

        waiting = false;

        box.className = "idle";

        box.textContent = "reaction time test w/ sfx";

        feedback.innerHTML = `
<div class="fail">
    <div class="feedback-result">TOO EARLY</div>
    <div class="feedback-info">Wait until the sound plays.</div>
</div>`;
        return;
    }

    if(ready){

        const reaction = performance.now() - startTime;

        ready = false;

        box.className = "idle";

        const threshold = currentAttack.timing - 32;

        const success = reaction < threshold;

        const technique =
            currentAttack.technique === "NoTilt"
            ? ""
            : ` (${currentAttack.technique})`;

        if(success){

            box.textContent = "Click to Start";
            feedback.innerHTML = `
<div class="pass">
    <div class="feedback-title">${reaction.toFixed(0)} ms</div>
    <div class="feedback-result">PASS</div>
    <div class="feedback-info">Spiker: ${currentAttack.spiker}${technique}<br>Height: ${currentAttack.height}<br>Target: Under ${threshold} ms</div>
</div>`;

        }else{

            box.textContent = "Click to Start";

           feedback.innerHTML = `
            <div class="fail">
            <div class="feedback-title">${reaction.toFixed(0)} ms</div>
            <div class="feedback-result">FAIL</div>
        
            <div class="feedback-info">Spiker: ${currentAttack.spiker}${technique}
            <br>Height: ${currentAttack.height}
            <br>Should've been earlier than ${threshold} ms
            </div>
        </div>`;
        }
    }
};
</script>

</body>
</html>
